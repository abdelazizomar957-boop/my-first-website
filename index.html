<header><h1>استوديو الوثائق – توكيد الجودة</h1><small>تحليل الوثائق · إنشاء الإجراءات · قوائم المراجعة الداخلية</small></header>

<script>
/* ============ Storage layer (swap for DB later) ============ */
const Store={g(k,d){try{const v=localStorage.getItem('ds_'+k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem('ds_'+k,JSON.stringify(v))}catch(e){}}};
/* ============ AI Layer: providers are pluggable ============ */
const Providers={
 claude:{label:'Claude (عبر Claude.ai)',async call(prompt,json){const s=await claude.use('sample');if(!s)throw new Error('خدمة Claude غير متاحة في هذه النافذة. افتح الصفحة من claude.ai.');return json?await s.json(prompt,{modelTier:'complex'}):(await s(prompt,{modelTier:'complex'})).text}}
 /* أضف مزودين آخرين هنا بنفس الواجهة: {label, call(prompt,json)} */
};
const AI={async run(prompt,json=true){const p=Providers[Store.g('provider','claude')];return p.call(prompt,json)}};
/* ============ Business logic: prompts (provider-agnostic) ============ */
const RULES=`قواعد صارمة: اكتب بالعربية. لا تخترع Transaction Codes أو وظائف SAP غير مؤكدة (اكتب "يُؤكد مع فريق SAP" بدلاً من ذلك). ميّز دائمًا بين: متطلب داخلي من الوثيقة، Best Practice، ومتطلب خارجي. لا تذكر مصدرًا غير مؤكد. صياغة بنود قائمة التحقق على نمط قوائم نهضة مصر: كل بند سؤال يبدأ بـ"هل يوجد ...؟"، والمرجعية (ref) اسم السياسة/العملية ذات الصلة (مثل Documented Information policy أو اسم السياسة في الوثيقة)، والدليل المتوقع (expected) وصف مختصر لما يطلبه المراجع، والمسؤول (responsible) والخطر (risk) اختياريان.`;
const CL_SCHEMA=`"checklist":[{"ref":"","q":"هل يوجد ...؟","expected":"","responsible":"","risk":"","source":"موضع البند في الوثيقة","iso":"البند المرجعي في المعيار","legal":"المرجع التشريعي إن وُجد","origin":"internal|best_practice|external"}],"tips":["نصيحة توعوية قصيرة وعملية"]`;
const kbText=()=>{const k=Store.g('kb','').trim();return k?`\nسياق الشركة (استخدمه عند الصلة فقط):\n${k.slice(0,6000)}`:''};
const SUM='ملخص الملف (الهدف من الوثيقة، نطاق التطبيق، توزيع الوثيقة: منصة المعرفة الإلكترونية QMS SharePoint – في نطاق المسئوليات الخاصة بالوثيقة)',TERMS='المصطلحات والتعريفات (جدول: م | المصطلح/الاختصار | التعريف)',RESP='المسئوليات والصلاحيات',REL='الوثائق ذات الصلة (جدول: م | اسم الوثيقة | الوصف | كود الوثيقة | تبعية الوثيقة | نوع الوثيقة | طبيعة حفظ الوثيقة | مدة الحفظ | موقع الحفظ | المسئول عن الحفظ)',REFS='المراجع المستخدمة';
const TPL={'Policy':{c:'PL',h:[SUM,TERMS,'السياسة العامة المتبعة','القواعد والإجراءات',RESP,REL,REFS]},'Procedure / SOP':{c:'PR',h:[SUM,TERMS,'القواعد والإجراءات',RESP,REL,REFS]},'Work Instruction':{c:'WI',h:['الغرض من الوثيقة','نطاق الوثيقة',TERMS,'التعليمات المتبعة (افعل / لا تفعل)',RESP,REL,REFS]},'Workflow / Process Mapping':{c:'PS',h:['ملخص الملف (الغرض من الوثيقة، نطاق الوثيقة، المصطلحات والتعريفات، ملخص العملية، مكونات العملية: جدول SIPOC بأعمدة م | نطاق العملية | المورد | المدخلات | العملية | النتيجة | العميل)','تعريف وتفصيل العمليات (اسم العملية، خريطة العملية كخطوات مرقمة متسلسلة مع نقاط القرار، وصف العملية، شرح الأنشطة والمسئوليات في جدول)',REL,REFS]}};
const TRULES=`اتبع قالب نهضة مصر: draft يبدأ مباشرة من أول قسم ولا يتضمن الغلاف أو الموافقات أو تاريخ الوثيقة (يضيفها التطبيق). استخدم عناوين # بنفس أسماء الأقسام وترتيبها. القواعد والإجراءات تتبع Plan>>Do>>Check>>Act ومرقمة بتسلسل الحدوث، ويُميَّز موضع التوثيق هكذا (باستخدام "نموذج كذا"). تبدأ المسئولية بكلمة "مسئولية (فعل)" والصلاحية بكلمة "صلاحية (فعل)". أكواد الوثائق غير المعروفة اكتبها NM-****-**-**-**-** ولا تخترع أسماء أشخاص أو أكواد. مواقع الحفظ ومدده من المعتاد في الشركة (Document Management Centre، Shared Folder، SAP، إلخ) مع تمييز الافتراضي.`;
const GOV='الحوكمة والرقابة الداخلية (فصل المهام، صلاحيات الاعتماد، نقاط التحكم، التصعيد، السجلات والأدلة، المراقبة) والتميز التشغيلي Operational Excellence (تقليل الهدر وفق Lean، مؤشرات الأداء KPIs، مستويات الخدمة SLA، العمل القياسي، التحسين المستمر)';
const LEG=d=>`القوانين والتشريعات: حدّد التشريعات واللوائح ذات الصلة بنشاط الإدارة المالكة للوثيقة في جمهورية مصر العربية (${d?'الإدارة المالكة: '+d:'استنتج الإدارة المالكة من الوثيقة أو الموضوع واذكرها صراحةً'}). اذكر فقط ما أنت متأكد من وجوده، ولا تخترع أرقام قوانين أو مواد؛ وإن لم تتأكد فاذكر المجال التشريعي واطلب التحقق منه. كل مرجع تشريعي يُوسم external ويُعلَّم غير مؤكد حتى يتحقق منه المستخدم.`;
const OHS45='ISO 45001:2018 وISO 14001:2015 (مثل 45001: 6.1.2 تحديد المخاطر، 8.1.2 تسلسل ضوابط المخاطر، 8.2 الاستعداد للطوارئ؛ و14001: 6.1.2 الجوانب البيئية، 8.1 التخطيط والتحكم التشغيلي)';
const AUD='منهجية المراجعة (من Skill المراجعة الداخلية ISO 9001 المعتمد لدى الفريق): ابدأ بتدفق العملية الفعلي (مدخلات ← أنشطة ← مخرجات ← مؤشرات أداء) ثم اربط كل بند ببند الأيزو لاحقًا، ولا تبنِ القائمة بندًا بندًا من المعيار. اجعل حقل expected دليلًا موضوعيًا يُطلب عرضه (سجل، نموذج، مخرج نظام، توقيع) مع العيّنة المقترحة (من 2 إلى 3 سجلات من فترات مختلفة، أو مقابلة شخصين)، ولا يُقبل الكلام الشفهي دليلًا. أبقِ صياغة "هل يوجد ...؟" كنمط قوائم الشركة. أدرج عند الانطباق بندًا لمتابعة فاعلية الإجراءات التصحيحية السابقة (10.2) وبندًا لمقارنة الأداء بمؤشرات الأداء المذكورة في الوثيقة (9.1).';
const ISO=(ohs,d)=>`مرجعية قائمة التحقق: ${ohs?'الوثيقة تتعلق بالسلامة والصحة المهنية أو البيئة، فالمرجعية '+OHS45+' بدلًا من ISO 9001:2015. اذكر في iso البند المناسب من المعيار المنطبق.':'ISO 9001:2015 (مثل 7.5 المعلومات الموثقة، 8.5 الإنتاج وتقديم الخدمة، 8.7 المخرجات غير المطابقة، 9.1 المراقبة والقياس، 10.2 عدم المطابقة والإجراء التصحيحي). اذكر في iso أنسب بند لكل بند فحص، وإن ظهر في الوثيقة ما يخص السلامة والصحة المهنية أو البيئة فطبّق عليه مرجعية '+OHS45+' بدلًا من 9001.'} اذكر رقم البند الفرعي فقط إن كنت متأكدًا منه وإلا الرئيسي. بنود القائمة تبقى مبنية على ما في الوثيقة فعلًا؛ وما يأتي من الأيزو أو التشريعات وليس من الوثيقة يوسم origin="external" ولا تُكثر منه. ${LEG(d)} ضع المرجع التشريعي في حقل legal. وراعِ في اختيار بنود الفحص ${GOV}. ${AUD}`;
const ISOC=(ohs,d)=>`معايير الامتثال: ${ohs?'الوثيقة تخص السلامة والصحة المهنية أو البيئة: يجب أن تستوفي بنود '+OHS45+' بدلًا من ISO 9001:2015، وتُذكر البنود المعتمدة عليها في المراجع وضوابطها في الخطوات.':'يجب أن تستوفي الوثيقة بنود ISO 9001:2015 المنطبقة (مثل 4.4 نهج العمليات، 5.3 الأدوار والمسئوليات والصلاحيات، 6.1 المخاطر والفرص، 7.5 المعلومات الموثقة، 8.1 التخطيط والتحكم التشغيلي، 9.1 المراقبة والقياس، 10.2 عدم المطابقة والإجراء التصحيحي)، وإن ظهر أن الموضوع يخص السلامة والصحة المهنية أو البيئة فتستوفي بنود '+OHS45+' بدلًا منه.'} ${LEG(d)} ضع في الخطوات نفسها دون أقسام زائدة: ${GOV}. ضع SLA افتراضيًا معقولًا (بالساعات أو الأيام) لكل خطوة تحتاج زمنًا ووسمه "SLA افتراضي – يُعتمد من مالك العملية" وأدرجه في review.assumptions. اذكر في المراجع بنود المعايير والتشريعات المعتمدة عليها فقط، وأدرج التشريعات في sources بنوع regulatory وverified=false ما لم تتحقق منها.`;
const P={
 analyze:(t,ohs,dept)=>`حلّل الوثيقة التالية كما هي دون إعادة كتابة أو تحسين أو إضافة متطلبات من عندك. افهم العملية من بدايتها لنهايتها.
${RULES}
${ISO(ohs,dept)}
المطلوب: Checklist للمراجعة الداخلية مبنية على خطوات التنفيذ والضوابط والمسؤوليات ونقاط التحكم فقط (ليس المقدمة أو التعريفات). كل بند origin="internal" ما لم يكن Best Practice صريحًا. ثم نصائح توعوية قصيرة (8 كحد أقصى) مرتبطة بالوثيقة.
أعد JSON فقط بالشكل: {"title":"","summary":"ملخص العملية في 3 جمل",${CL_SCHEMA}}
الوثيقة:
"""${t}"""`,
 clarify:(ty,topic)=>`نوع الوثيقة: ${ty}. الموضوع: "${topic}". ${kbText()}
اطرح 3 إلى 5 أسئلة توضيحية قصيرة فقط تؤثر فعلاً على جودة الوثيقة (النطاق، الأدوار، الموافقات، النظام المستخدم، SLA). أعد JSON: {"questions":["..."]}`,
 create:(ty,topic,qa,ohs,dept)=>`أنشئ وثيقة مؤسسية من نوع ${ty} عن: "${topic}".
إجابات المستخدم: ${qa||'لم يُجب – اذكر افتراضاتك صراحةً'}${kbText()}
${RULES}
${TRULES}
${ISOC(ohs,dept)}
الأقسام بالترتيب: ${TPL[ty].h.join(' ← ')}
ادمج الضوابط الداخلية، الحوكمة، المخاطر، فصل المهام، صلاحيات الاعتماد، الأدوار، التصعيد، الـSLA، KPIs، السجلات، الاستثناءات، والمراقبة داخل خطوات الوثيقة دون أقسام زائدة. إن ارتبط الموضوع بـSAP/ERP راعِ: النشاط، الموافقة، Master Data، الضبط، الدور، SoD، الدليل.
استخدم البحث على الإنترنت إن كان متاحًا للمصادر الرسمية، واذكر في sources ما اعتمدت عليه فعلًا فقط، وverified=true فقط إن تحققت منه.
أعد JSON فقط: {"title":"اسم الوثيقة بالعربية","title_en":"","draft":"","review":{"risks":[""],"missing_controls":[""],"assumptions":[""],"improvements":[""]},"sources":[{"title":"","url":"","type":"standard|regulatory|best_practice|other","used_for":"","verified":false}]}`
};
/* ============ Helpers ============ */
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(t){const L=esc(t).split('\n');let o='',inT=0,inL=0;const cl=()=>{if(inL){o+='</ul>';inL=0}if(inT){o+='</table>';inT=0}};
 for(const l of L){if(/^\s*\|.*\|\s*$/.test(l)){if(/^[\s|:-]+$/.test(l))continue;if(inL){o+='</ul>';inL=0}const c=l.trim().slice(1,-1).split('|').map(x=>x.trim());if(!inT){o+='<table>';o+='<tr>'+c.map(x=>`<th>${x}</th>`).join('')+'</tr>';inT=1}else o+='<tr>'+c.map(x=>`<td>${x}</td>`).join('')+'</tr>';continue}
 if(inT){o+='</table>';inT=0}
 let m;if(m=l.match(/^(#{1,4})\s+(.*)/)){cl();o+=`<h3>${m[2]}</h3>`}else if(m=l.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)/)){if(!inL){o+='<ul>';inL=1}o+=`<li>${m[1]}</li>`}else{cl();if(l.trim())o+=`<p>${l}</p>`}}
 cl();return o.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
const ORIG={internal:'داخلي',best_practice:'Best Practice',external:'متطلب خارجي'};
const RATE='<span class="tag">Conformity</span> <span class="tag">NC_Major (7 أيام)</span> <span class="tag">NC_Minor (14 يومًا)</span> <span class="tag">P_Improve (21 يومًا)</span>';
function clTable(c){return `<div class="tbl"><table><tr><th>المرجعية</th><th>م</th><th>بند التحقق</th><th>دليل التطابق / عدم التطابق</th><th>التقييم</th><th>Action required</th></tr>${(c||[]).map((r,i)=>`<tr><td>${esc(r.ref)}<br><small style="color:var(--mu)">${esc(r.iso)}</small>${r.legal?'<br><small style="color:var(--mu)">'+esc(r.legal)+'</small>':''}<br><span class="tag">${ORIG[r.origin]||esc(r.origin)}</span></td><td>${i+1}</td><td>${esc(r.q||r.requirement)}<br><small style="color:var(--mu)">${esc(r.source)}</small></td><td><small style="color:var(--mu)">المتوقع: ${esc(r.expected||r.evidence)}${r.responsible?' | المسؤول: '+esc(r.responsible):''}${r.risk?' | الخطر: '+esc(r.risk):''}</small></td><td></td><td></td></tr>`).join('')}</table></div><p>${RATE}</p>`}
function metaForm(){return `<div class="row"><div><label>تاريخ المراجعة</label><input id="m_date" placeholder="00/00/2026"></div><div><label>موقع المراجعة</label><input id="m_loc"></div><div><label>اسم القطاع</label><input id="m_sec"></div><div><label>اسم الإدارة</label><input id="m_dept"></div><div><label>نوع المراجعة</label><input id="m_type" value="مخطط"></div><div><label>المراجع</label><input id="m_ref" value="ISO 9001, ISO14001, ISO 45001 & NM Integrated Management System"></div></div>`}
